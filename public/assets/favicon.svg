<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Evangelion Alert Amber-Yellow Background -->
  <rect width="64" height="64" rx="12" fill="#FFBA00"/>

  <!-- Concentric Target & Sensor Circles -->
  <circle cx="32" cy="26.5" r="23" stroke="#000000" stroke-width="2" fill="none" opacity="0.85"/>
  <circle cx="32" cy="26.5" r="18" stroke="#000000" stroke-width="1.2" fill="none" opacity="0.55"/>

  <!-- Triad 3-Blade Star / Rotor (Solid Black) -->
  <g transform="translate(32, 26.5)">
    <!-- Central Joint -->
    <circle cx="0" cy="0" r="7.5" fill="#000000"/>
    <!-- Melchior (Top) -->
    <path d="M -6,0 L -6,-22 L 6,-22 L 6,0 Z" fill="#000000"/>
    <!-- Balthasar (Bottom Left - 120 deg) -->
    <path d="M -6,0 L -6,-22 L 6,-22 L 6,0 Z" fill="#000000" transform="rotate(120)"/>
    <!-- Casper (Bottom Right - 240 deg) -->
    <path d="M -6,0 L -6,-22 L 6,-22 L 6,0 Z" fill="#000000" transform="rotate(240)"/>
  </g>

  <!-- Numbers in Blades -->
  <text x="32" y="14.5" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="7.5" fill="#FFBA00" text-anchor="middle">1</text>
  <text x="19" y="36.5" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="7.5" fill="#FFBA00" text-anchor="middle">2</text>
  <text x="45" y="36.5" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="7.5" fill="#FFBA00" text-anchor="middle">3</text>

  <!-- Central Red "否決" Stamp from Reference -->
  <rect x="22" y="21.5" width="20" height="10" rx="1.5" fill="#E60012" stroke="#FFBA00" stroke-width="0.8"/>
  <text x="32" y="29" font-family="'Noto Sans JP', 'MS Gothic', sans-serif" font-weight="900" font-size="6" fill="#FFBA00" text-anchor="middle" letter-spacing="0.5">否決</text>

  <!-- Bottom MAGI Crimson Brand Typography with Black Stroke -->
  <text x="32" y="58" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="14.5" letter-spacing="1.2" fill="#E60012" stroke="#000000" stroke-width="1.8" paint-order="stroke fill" text-anchor="middle">MAGI</text>
</svg>